name: Deploy to Vercel

# Why this exists: on the Hobby plan Vercel only builds deployments whose commit
# author is the owner of the Vercel account. Every commit pushed from an agent
# account is therefore "Blocked", so the production site never changes.
#
# Two ways out, both independent of who authored the commit:
#   1. VERCEL_DEPLOY_HOOK_URL - Project -> Settings -> Git -> Deploy Hooks, for
#      branch main. The hook builds the latest commit on main on your behalf.
#   2. VERCEL_TOKEN + VERCEL_ORG_ID + VERCEL_PROJECT_ID - uploads the build with
#      git metadata removed, so there is no commit author for Vercel to reject.
#
# Add either set under Settings -> Secrets and variables -> Actions. With
# neither, this job reports a warning instead of failing.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy with the deploy hook
        if: env.VERCEL_DEPLOY_HOOK_URL != ''
        run: |
          curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK_URL" > /dev/null
          echo "Triggered the Vercel deploy hook; it is building the latest commit on main."

      - uses: oven-sh/setup-bun@v2
        if: env.VERCEL_DEPLOY_HOOK_URL == '' && env.VERCEL_TOKEN != ''
        with:
          bun-version: latest

      - name: Install dependencies
        if: env.VERCEL_DEPLOY_HOOK_URL == '' && env.VERCEL_TOKEN != ''
        run: bun install --frozen-lockfile

      - name: Test
        if: env.VERCEL_DEPLOY_HOOK_URL == '' && env.VERCEL_TOKEN != ''
        run: bun run test

      - name: Drop git metadata so the upload carries no commit author
        if: env.VERCEL_DEPLOY_HOOK_URL == '' && env.VERCEL_TOKEN != ''
        run: rm -rf .git

      - name: Pull Vercel project settings
        if: env.VERCEL_DEPLOY_HOOK_URL == '' && env.VERCEL_TOKEN != ''
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        if: env.VERCEL_DEPLOY_HOOK_URL == '' && env.VERCEL_TOKEN != ''
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to production
        if: env.VERCEL_DEPLOY_HOOK_URL == '' && env.VERCEL_TOKEN != ''
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Explain missing configuration
        if: env.VERCEL_DEPLOY_HOOK_URL == '' && env.VERCEL_TOKEN == ''
        run: |
          echo "::warning title=Vercel deploy skipped::Add VERCEL_DEPLOY_HOOK_URL, or VERCEL_TOKEN with VERCEL_ORG_ID and VERCEL_PROJECT_ID, as repository secrets to deploy from here."
