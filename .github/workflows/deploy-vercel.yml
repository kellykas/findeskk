name: Deploy to Vercel

# Vercel blocks Git deployment of commits whose author is not the account owner
# (Hobby plan). This workflow bypasses that: it uploads the build with the
# account's own token, so authorship of the commit no longer matters.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN       - Account Settings -> Tokens, scope it to the account
#   VERCEL_PROJECT_ID  - Project -> Settings -> General -> Project ID
#   VERCEL_ORG_ID      - Account Settings -> General -> Account ID
# Until VERCEL_TOKEN exists the job warns and exits without failing.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Explain missing configuration
        if: env.VERCEL_TOKEN == ''
        run: |
          echo "::warning title=Vercel deploy skipped::Add VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID as repository secrets to deploy from here."

      - name: Install dependencies
        if: env.VERCEL_TOKEN != ''
        run: bun install --frozen-lockfile

      - name: Test
        if: env.VERCEL_TOKEN != ''
        run: bun run test

      - name: Pull Vercel project settings
        if: env.VERCEL_TOKEN != ''
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        if: env.VERCEL_TOKEN != ''
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to production
        if: env.VERCEL_TOKEN != ''
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
